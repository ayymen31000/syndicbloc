services:
  - type: web
    name: syndicbloc
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ADMIN_DEFAULT_EMAIL
        value: aymen@syndic.dz
      - key: USER_AYMEN_USERNAME
        value: aymen
      - key: USER_AYMEN_PASSWORD
        value: aymen31
