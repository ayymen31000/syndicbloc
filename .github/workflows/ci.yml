name: CI Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-secret-for-testing-purposes-minimum-32-chars-long!"
      JWT_REFRESH_SECRET: "ci-refresh-secret-for-testing-purposes-minimum-32-chars!"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Push DB
        run: |
          npx prisma generate
          node scripts/setup-db.js

      - name: Run Test Suite
        run: npm test
